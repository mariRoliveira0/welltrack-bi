<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WellTrack BI</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:      #FAF7F4;
      --rose:       #D4A5A5;
      --rose-dark:  #B8797A;
      --rose-light: #EDD8D8;
      --blush:      #F2E4E4;
      --charcoal:   #3A3A3A;
      --grey:       #9A9A9A;
      --sage:       #7D9E8C;
      --white:      #FFFFFF;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      background-color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        radial-gradient(ellipse at 10% 10%, rgba(212,165,165,0.3) 0%, transparent 55%),
        radial-gradient(ellipse at 90% 90%, rgba(212,165,165,0.2) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 10%, rgba(237,216,216,0.4) 0%, transparent 40%);
      overflow: hidden;
    }

    /* Floating decorative blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      opacity: 0.35;
    }
    .blob-1 { width: 350px; height: 350px; background: #EBB8B8; top: -100px; right: -60px; }
    .blob-2 { width: 250px; height: 250px; background: #D4C5BE; bottom: -60px; left: -60px; }
    .blob-3 { width: 180px; height: 180px; background: #F2D8D8; top: 60%; right: 5%; }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 32px;
    }

    /* Logo */
    .logo-wrap {
      margin-bottom: 24px;
      animation: fadeUp 0.7s ease both;
    }

    /* Brand */
    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 46px;
      font-weight: 300;
      color: var(--charcoal);
      letter-spacing: 3px;
      line-height: 1;
      margin-bottom: 8px;
      animation: fadeUp 0.7s 0.1s ease both;
    }

    .brand-sub {
      font-size: 10px;
      font-weight: 500;
      color: var(--rose);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 36px;
      animation: fadeUp 0.7s 0.15s ease both;
    }

    /* Dots */
    .dots {
      display: flex;
      gap: 8px;
      margin-bottom: 44px;
      animation: fadeUp 0.7s 0.2s ease both;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rose-light); }
    .dot.active { background: var(--rose); }

    /* Button group */
    .btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fadeUp 0.7s 0.25s ease both;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border-radius: 50px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      letter-spacing: 0.3px;
    }

    .btn-solid {
      background: var(--rose);
      color: var(--white);
      box-shadow: 0 4px 20px rgba(212,165,165,0.45);
    }
    .btn-solid:hover { background: var(--rose-dark); transform: translateY(-1px); box-shadow: 0 6px 24px rgba(184,121,122,0.4); }

    .btn-ghost {
      background: transparent;
      color: var(--grey);
      border: 1.5px solid #E5DADA;
    }
    .btn-ghost:hover { border-color: var(--rose-light); color: var(--rose-dark); transform: translateY(-1px); }

    /* Form */
    .form-wrap {
      width: 100%;
      display: none;
      flex-direction: column;
      gap: 16px;
      animation: fadeUp 0.35s ease both;
    }
    .form-wrap.visible { display: flex; }

    .form-group { text-align: left; }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--grey);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 18px;
      background: var(--white);
      border: 1.5px solid #EAE0E0;
      border-radius: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--charcoal);
      outline: none;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .form-group input::placeholder { color: #CCC; }
    .form-group input:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px rgba(212,165,165,0.2);
    }

    .btn-signin {
      background: var(--rose);
      color: var(--white);
      box-shadow: 0 4px 20px rgba(212,165,165,0.45);
      margin-top: 4px;
    }
    .btn-signin:hover { background: var(--rose-dark); transform: translateY(-1px); }
    .btn-signin:active { transform: scale(0.98); }

    .btn-back {
      background: none;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--grey);
      cursor: pointer;
      padding: 6px;
      transition: color 0.2s;
      margin-top: -6px;
    }
    .btn-back:hover { color: var(--rose-dark); }

    .error-msg {
      background: #FFF0F0;
      border: 1px solid var(--rose-light);
      color: var(--rose-dark);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      display: none;
    }
    .error-msg.show { display: block; }

    /* Footer */
    .footer {
      margin-top: 44px;
      font-size: 11px;
      color: #C5B8B8;
      letter-spacing: 0.3px;
      animation: fadeUp 0.7s 0.35s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="card">

    <!-- Logo SVG: pink dumbbell + revenue bars -->
    <div class="logo-wrap">
      <svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- Background circle -->
        <circle cx="48" cy="48" r="46" fill="#FDF0F0" stroke="#EDD8D8" stroke-width="1.5"/>

        <!-- LEFT HEX WEIGHT (pointy-top hexagon, center 18,34, r=13) -->
        <polygon points="18,21 29.3,27.5 29.3,40.5 18,47 6.7,40.5 6.7,27.5" fill="#D4A5A5"/>
        <!-- Shine highlight -->
        <polygon points="18,21 29.3,27.5 25,27 15,22.5" fill="rgba(255,255,255,0.28)"/>

        <!-- HANDLE -->
        <rect x="29" y="30" width="38" height="8" rx="4" fill="#C49090"/>
        <rect x="29" y="30" width="38" height="3" rx="1.5" fill="rgba(255,255,255,0.22)"/>

        <!-- RIGHT HEX WEIGHT (center 78,34, r=13) -->
        <polygon points="78,21 89.3,27.5 89.3,40.5 78,47 66.7,40.5 66.7,27.5" fill="#D4A5A5"/>
        <!-- Shine highlight -->
        <polygon points="78,21 89.3,27.5 85,27 75,22.5" fill="rgba(255,255,255,0.28)"/>

        <!-- Revenue bars (ascending) -->
        <rect x="30" y="65" width="9" height="13" rx="3" fill="#EDD8D8"/>
        <rect x="42" y="59" width="9" height="19" rx="3" fill="#D4A5A5"/>
        <rect x="54" y="52" width="9" height="26" rx="3" fill="#B8797A"/>
      </svg>
    </div>

    <div class="brand-name">welltrack</div>
    <div class="brand-sub">Business Intelligence</div>

    <div class="dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <!-- Landing buttons -->
    <div class="btn-group" id="btnGroup">
      <button class="btn btn-solid" onclick="showForm()">Sign In</button>
      <button class="btn btn-ghost">Learn More</button>
    </div>

    <!-- Login form -->
    <div class="form-wrap" id="formWrap">
      <div class="error-msg" id="errorMsg">Invalid username or password. Please try again.</div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="username"/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="btn btn-signin" onclick="doLogin()">Sign In</button>
      <button class="btn-back" onclick="hideForm()">← Back</button>
    </div>

    <div class="footer">By continuing you agree to our Terms &amp; Privacy Policy</div>
  </div>

  <script>
    if (new URLSearchParams(window.location.search).get('error')) {
      showForm();
      document.getElementById('errorMsg').classList.add('show');
    }

    function showForm() {
      document.getElementById('btnGroup').style.display = 'none';
      const form = document.getElementById('formWrap');
      form.classList.add('visible');
      setTimeout(() => document.getElementById('username').focus(), 100);
    }

    function hideForm() {
      document.getElementById('formWrap').classList.remove('visible');
      document.getElementById('btnGroup').style.display = 'flex';
    }

    function doLogin() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      if (!username || !password) return;

      const form = document.createElement('form');
      form.method = 'POST';
      form.action = '/api/auth/login';

      const u = document.createElement('input');
      u.type = 'hidden'; u.name = 'username'; u.value = username;
      form.appendChild(u);

      const p = document.createElement('input');
      p.type = 'hidden'; p.name = 'password'; p.value = password;
      form.appendChild(p);

      document.body.appendChild(form);
      form.submit();
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && document.getElementById('formWrap').classList.contains('visible')) {
        doLogin();
      }
    });
  </script>

</body>
</html>
