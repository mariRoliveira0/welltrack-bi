<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WellTrack BI — Practitioners</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #FAF7F4; --white: #FFFFFF; --rose: #D4A5A5; --rose-dark: #B8797A;
      --rose-light: #EDD8D8; --blush: #F7EDED; --sage: #7D9E8C; --sage-light: #EAF2EE;
      --charcoal: #3A3330; --grey: #9A9490; --sidebar-w: 240px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; display: flex; }
    .sidebar { width: var(--sidebar-w); min-height: 100vh; background: var(--charcoal); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; z-index: 100; padding: 32px 0; }
    .sidebar-brand { padding: 0 24px 32px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 12px; }
    .sidebar-logo { width: 38px; height: 38px; flex-shrink: 0; }
    .sidebar-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 400; color: var(--white); letter-spacing: 1px; line-height: 1.1; }
    .sidebar-title span { display: block; font-size: 9px; letter-spacing: 3px; color: var(--rose); text-transform: uppercase; font-family: 'DM Sans', sans-serif; margin-top: 2px; }
    .sidebar-nav { flex: 1; padding: 24px 0; }
    .nav-label { font-size: 9px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.3); padding: 0 24px; margin-bottom: 8px; margin-top: 20px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 24px; color: rgba(255,255,255,0.55); text-decoration: none; font-size: 14px; transition: all 0.2s; border-left: 3px solid transparent; }
    .nav-item:hover { color: var(--white); background: rgba(255,255,255,0.05); }
    .nav-item.active { color: var(--white); background: rgba(212,165,165,0.12); border-left-color: var(--rose); }
    .nav-icon { font-size: 16px; width: 20px; text-align: center; }
    .sidebar-footer { padding: 24px; border-top: 1px solid rgba(255,255,255,0.08); }
    .logout-btn { display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,0.4); font-size: 14px; cursor: pointer; background: none; border: none; font-family: 'DM Sans', sans-serif; transition: color 0.2s; }
    .logout-btn:hover { color: var(--rose); }
    .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }
    .topbar { background: var(--white); border-bottom: 1px solid #F0EAEA; padding: 0 36px; height: 68px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
    .topbar-left h1 { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 400; color: var(--charcoal); }
    .topbar-left p { font-size: 12px; color: var(--grey); margin-top: 1px; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .btn { padding: 9px 20px; border-radius: 20px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; border: none; }
    .btn-rose { background: var(--rose); color: var(--white); box-shadow: 0 4px 14px rgba(212,165,165,0.35); }
    .btn-rose:hover { background: var(--rose-dark); transform: translateY(-1px); }
    .btn-ghost { background: var(--blush); color: var(--rose-dark); border: 1px solid var(--rose-light); }
    .btn-ghost:hover { background: var(--rose-light); }
    .avatar { width: 36px; height: 36px; background: var(--rose); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--white); font-size: 13px; font-weight: 600; }
    .content { padding: 32px 36px; flex: 1; }
    .stats-row { display: flex; gap: 16px; margin-bottom: 28px; }
    .stat-pill { background: var(--white); border: 1px solid #F0EAEA; border-radius: 12px; padding: 16px 24px; display: flex; align-items: center; gap: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .stat-pill-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .icon-rose { background: var(--blush); } .icon-sage { background: var(--sage-light); } .icon-warm { background: #F5F0EA; }
    .stat-pill-info p { font-size: 11px; color: var(--grey); text-transform: uppercase; letter-spacing: 1px; }
    .stat-pill-info strong { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500; color: var(--charcoal); }
    .toolbar { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; }
    .search-wrap { flex: 1; position: relative; }
    .search-wrap input { width: 100%; padding: 11px 16px 11px 40px; background: var(--white); border: 1.5px solid #F0EAEA; border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--charcoal); outline: none; transition: border-color 0.2s; }
    .search-wrap input:focus { border-color: var(--rose); }
    .search-wrap input::placeholder { color: #CCC; }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; pointer-events: none; }
    .table-card { background: var(--white); border-radius: 16px; border: 1px solid #F0EAEA; box-shadow: 0 2px 12px rgba(0,0,0,0.04); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead th { background: var(--blush); padding: 13px 20px; text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--rose-dark); border-bottom: 1px solid var(--rose-light); }
    tbody tr { border-bottom: 1px solid #FAF4F4; transition: background 0.15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #FDFAFA; }
    tbody td { padding: 14px 20px; font-size: 14px; color: var(--charcoal); vertical-align: middle; }
    .prac-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--sage-light); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--sage); margin-right: 10px; vertical-align: middle; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
    .badge-active { background: #E8F4EF; color: #4A8A6A; }
    .badge-inactive { background: #F5EFEF; color: #9A6060; }
    .action-btns { display: flex; gap: 8px; }
    .btn-icon { width: 30px; height: 30px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.15s; }
    .btn-edit { background: #EAF2EE; } .btn-edit:hover { background: #C5D9CE; }
    .btn-delete { background: #FAF0F0; } .btn-delete:hover { background: #F0DADA; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--grey); }
    .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(58,51,48,0.4); backdrop-filter: blur(4px); z-index: 200; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--white); border-radius: 20px; padding: 36px; width: 480px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,0.15); animation: modalIn 0.25s ease; }
    @keyframes modalIn { from { opacity: 0; transform: translateY(16px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 400; color: var(--charcoal); }
    .modal-close { background: var(--blush); border: none; border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 16px; color: var(--grey); transition: all 0.2s; }
    .modal-close:hover { background: var(--rose-light); color: var(--rose-dark); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 11px; font-weight: 500; color: var(--grey); text-transform: uppercase; letter-spacing: 1px; }
    .form-group input, .form-group select { padding: 12px 14px; border: 1.5px solid #EAE0E0; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--charcoal); outline: none; transition: border-color 0.2s; background: var(--cream); }
    .form-group input:focus, .form-group select:focus { border-color: var(--rose); box-shadow: 0 0 0 3px rgba(212,165,165,0.15); }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
    .btn-cancel { padding: 10px 20px; border-radius: 10px; background: var(--cream); border: 1px solid #EAE0E0; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--grey); cursor: pointer; transition: all 0.2s; }
    .btn-cancel:hover { border-color: var(--rose-light); color: var(--rose-dark); }
    .btn-save { padding: 10px 24px; border-radius: 10px; background: var(--rose); border: none; color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 14px rgba(212,165,165,0.35); }
    .btn-save:hover { background: var(--rose-dark); }
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--charcoal); color: var(--white); padding: 12px 20px; border-radius: 12px; font-size: 14px; z-index: 300; display: none; animation: slideUp 0.3s ease; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
    .toast.show { display: block; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-brand">
    <svg class="sidebar-logo" viewBox="0 0 38 38" fill="none">
      <rect width="38" height="38" rx="10" fill="rgba(212,165,165,0.2)"/>
      <text x="19" y="25" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#D4A5A5" letter-spacing="1">WT</text>
    </svg>
    <div class="sidebar-title">welltrack<span>Business Intelligence</span></div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">Main</div>
    <a class="nav-item" href="dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
    <a class="nav-item" href="clients.html"><span class="nav-icon">👤</span> Clients</a>
    <a class="nav-item active" href="practitioners.html"><span class="nav-icon">🧘</span> Practitioners</a>
    <a class="nav-item" href="sessions.html"><span class="nav-icon">📅</span> Sessions</a>
    <div class="nav-label">Analytics</div>
    <a class="nav-item" href="analytics.html"><span class="nav-icon">💰</span> Revenue</a>
  </nav>
  <div class="sidebar-footer">
    <button class="logout-btn" onclick="logout()">🚪 Sign Out</button>
  </div>
</aside>

<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <h1>Practitioners</h1>
      <p>Manage your studio's team</p>
    </div>
    <div class="topbar-right">
      <button class="btn btn-rose" onclick="openModal()">+ Add Practitioner</button>
      <div class="avatar">M</div>
    </div>
  </header>
  <div class="content">
    <div class="stats-row">
      <div class="stat-pill">
        <div class="stat-pill-icon icon-sage">🧘</div>
        <div class="stat-pill-info"><p>Total Practitioners</p><strong id="totalPrac">—</strong></div>
      </div>
      <div class="stat-pill">
        <div class="stat-pill-icon icon-rose">✅</div>
        <div class="stat-pill-info"><p>Active</p><strong id="activePrac">—</strong></div>
      </div>
    </div>
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search practitioners…" oninput="filterPractitioners()"/>
      </div>
      <button class="btn btn-ghost" onclick="loadPractitioners()">↻ Refresh</button>
    </div>
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Specialisation</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="pracTableBody">
          <tr><td colspan="6"><div class="empty-state"><div class="empty-icon">🌸</div><p>Loading…</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Add Practitioner</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-grid">
      <input type="hidden" id="pracId"/>
      <div class="form-group full"><label>Full Name</label><input type="text" id="fullName" placeholder="Sofia Costa"/></div>
      <div class="form-group full"><label>Specialisation</label><input type="text" id="specialisation" placeholder="Pilates, Yoga, Reformer…"/></div>
      <div class="form-group full"><label>Email</label><input type="email" id="email" placeholder="sofia@studio.com"/></div>
      <div class="form-group"><label>Phone</label><input type="text" id="phone" placeholder="+353 87 000 0000"/></div>
      <div class="form-group"><label>Status</label>
        <select id="active"><option value="true">Active</option><option value="false">Inactive</option></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="savePractitioner()">Save</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  let all = [];

  async function loadPractitioners() {
    try {
      const res = await fetch('/api/practitioners');
      if (!res.ok) throw new Error();
      all = await res.json();
      renderTable(all);
      document.getElementById('totalPrac').textContent = all.length;
      document.getElementById('activePrac').textContent = all.filter(p => p.active !== false).length;
    } catch {
      document.getElementById('pracTableBody').innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">⚠️</div><p>Could not load. Is the server running?</p></div></td></tr>`;
    }
  }

  function renderTable(data) {
    const tbody = document.getElementById('pracTableBody');
    if (!data.length) { tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">🌸</div><p>No practitioners found.</p></div></td></tr>`; return; }
    tbody.innerHTML = data.map(p => {
      const name = p.fullName||p.full_name||'Unknown';
      const parts = name.trim().split(' ');
      const initials = (parts[0][0]+(parts[1]?parts[1][0]:'')).toUpperCase();
      const active = p.active !== false;
      return `<tr>
        <td><span class="prac-avatar">${initials}</span><strong>${name}</strong></td>
        <td>${p.specialty||p.specialisation||p.specialization||'—'}</td>
        <td>${p.email||'—'}</td>
        <td>${p.phone||'—'}</td>
        <td><span class="badge ${active?'badge-active':'badge-inactive'}">${active?'Active':'Inactive'}</span></td>
        <td><div class="action-btns">
          <button class="btn-icon btn-edit" onclick="editPractitioner(${p.id})" title="Edit">✏️</button>
          <button class="btn-icon btn-delete" onclick="deletePractitioner(${p.id},'${name}')" title="Delete">🗑️</button>
        </div></td>
      </tr>`;
    }).join('');
  }

  function filterPractitioners() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    renderTable(all.filter(p => {
      const name = (p.fullName||p.full_name||'').toLowerCase();
      return name.includes(q) || (p.specialty||p.specialisation||'').toLowerCase().includes(q);
    }));
  }

  function openModal(p=null) {
    document.getElementById('modalTitle').textContent = p ? 'Edit Practitioner' : 'Add Practitioner';
    document.getElementById('pracId').value = p?.id||'';
    document.getElementById('fullName').value = p?.fullName||p?.full_name||'';
    document.getElementById('specialisation').value = p?.specialty||p?.specialisation||'';
    document.getElementById('email').value = p?.email||'';
    document.getElementById('phone').value = p?.phone||'';
    document.getElementById('active').value = p ? String(p.active!==false) : 'true';
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

  function editPractitioner(id) { openModal(all.find(p=>p.id===id)); }

  async function savePractitioner() {
    const id = document.getElementById('pracId').value;
    const body = {
      fullName: document.getElementById('fullName').value,
      specialty: document.getElementById('specialisation').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      active: document.getElementById('active').value==='true'
    };
    try {
      const res = await fetch(id?`/api/practitioners/${id}`:'/api/practitioners', {
        method: id?'PUT':'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
      });
      if (!res.ok) throw new Error();
      closeModal(); showToast(id?'✅ Updated!':'✅ Practitioner added!'); loadPractitioners();
    } catch { showToast('⚠️ Could not save.'); }
  }

  async function deletePractitioner(id, name) {
    if (!confirm(`Remove ${name}?`)) return;
    try {
      const res = await fetch(`/api/practitioners/${id}`, {method:'DELETE'});
      if (!res.ok) throw new Error();
      showToast(`🗑️ ${name} removed.`); loadPractitioners();
    } catch { showToast('⚠️ Could not delete.'); }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 3000);
  }

  function logout() { fetch('/api/auth/logout',{method:'POST'}).finally(()=>window.location.href='/login.html'); }
  document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
  loadPractitioners();
</script>
</body>
</html>
